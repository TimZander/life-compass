# GitHub Pages configuration for the Life Compass site.
#
# SUPERSEDED BUT STILL LOAD-BEARING. The site is now built by build/build.ts (see
# docs/decisions/0003), and this file plus _layouts/default.html are no longer what
# produces the output that ships. They are retained deliberately: the live domain is
# still served from main by GitHub Pages, and will be until the DNS cutover (#28).
# Deleting them now would leave every page on the live site unstyled in the meantime.
#
# Keep the nav here in step with build/layout.ts until #28 removes both this file and
# _layouts/, at which point the duplication ends.
#
# This repo needs no build tooling: GitHub Pages runs Jekyll for you and
# auto-enables the plugins that make the existing Markdown "just work" —
#   - jekyll-readme-index          : README.md becomes the site home page
#   - jekyll-optional-front-matter : plain .md files render as pages
#   - jekyll-relative-links        : [text](day-2-values.md) links are
#                                    rewritten to the generated page URLs
#
# To publish: Settings -> Pages -> Build and deployment ->
#   Source: "Deploy from a branch", Branch: main / (root) -> Save.

title: Life Compass
description: >-
  A 5-day investigation to surface your values, passions, and purpose —
  and turn them into a reference you can use for real decisions.
# Custom layout + stylesheet live in _layouts/ and assets/css/, so no
# packaged `theme:` is set — this site is themed by hand for a calm,
# journal-style reading experience.

# Served at a custom subdomain (see the CNAME file), so the site lives at
# the domain root and baseurl must be empty. If you ever revert to the
# github.io project URL, set baseurl back to "/life-compass".
url: https://lifecompass.timzander.com
baseurl: ""

# These are auto-enabled on GitHub Pages, but listing them makes local
# builds match and keeps behavior explicit.
plugins:
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings

# Engineering notes, not workbook content. Without this, jekyll-optional-front-matter
# renders every architecture decision record as its own orphan page on the published
# site — reachable by URL, linked from nothing.
exclude:
  # Jekyll's built-in exclude list is REPLACED, not extended, by anything set here,
  # so the usual Ruby-tooling entries have to be restated. node_modules is no longer
  # hypothetical — the typed build introduced it.
  #
  # docs/ was excluded when the decision records landed, on the assumption they were
  # repo-internal. They are published deliberately now, so the entry is gone and the
  # README's link to docs/decisions/ resolves here as well as in the new build.
  - Gemfile
  - Gemfile.lock
  - gemfiles
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Apply the theme's layout to every page (README + all .md files).
# Without this, pages render as unstyled HTML fragments with no <head>.
defaults:
  - scope:
      path: ""
    values:
      layout: default

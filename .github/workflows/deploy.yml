name: Deploy

# Production deploy to Cloudflare Pages on every push to main.
#
# This serves lifecompass.timzander.com. It stopped being consequence-free at the DNS
# cutover (#28), which is why the smoke test below runs against the custom domain
# rather than the pages.dev origin behind it: a zone sits in front of one and not the
# other, so they are not interchangeable for anything header-shaped.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize production deploys and never cancel one mid-upload. A cancelled deploy can
# leave the project serving a partially uploaded build, which is worse than a queue.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The build refuses to emit on a broken link, an anchor naming a heading that does
      # not exist, or a Markdown target reaching the output — so this is the last gate
      # before publishing, not merely a build step.
      - run: npm run build

      # Stamp the output so propagation can actually be detected. This is a deployment
      # concern, not a build one — the build has no business knowing about commits — so
      # it is written here rather than emitted by build.ts.
      - name: Stamp the build
        run: echo "$GITHUB_SHA" > dist/build.txt

      - name: Deploy to production
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=main matches the project's production branch, which is what makes
          # this a production deployment rather than a preview.
          command: pages deploy dist --project-name=life-compass --branch=main

      # Pages does not serve a new deploy on every edge instantly, so a smoke test run
      # immediately can read the PREVIOUS deployment and pass or fail for reasons that
      # have nothing to do with this build.
      #
      # Polling for a 200 on "/" — which this did until now — detects nothing: the
      # previous deployment already answers 200, so the loop exited on its first attempt
      # and every assertion below could run against the deployment it was meant to
      # replace. A passing run was not evidence that THIS build was tested.
      - name: Wait for propagation, then smoke-test
        env:
          BASE_URL: https://lifecompass.timzander.com
        run: |
          # ~5 minutes, exiting the moment this commit's stamp appears — so a normal
          # deploy costs seconds and only a genuinely slow tail spends the budget.
          served=""
          for _ in $(seq 1 60); do
            served=$(curl -sS "$BASE_URL/build.txt" 2>/dev/null | tr -d '[:space:]' || echo "")
            [ "$served" = "$GITHUB_SHA" ] && break
            sleep 5
          done

          if [ "$served" != "$GITHUB_SHA" ]; then
            echo "::error::this deployment never reached the edge (serving '$served', expected '$GITHUB_SHA'); nothing below would have tested it"
            exit 1
          fi
          echo "ok  build.txt matches $GITHUB_SHA — asserting against this deployment"

          fail=0

          # Retried, because build.txt matching is not the same as every path being
          # ready. The deploy for #51 went red on a healthy release: the newly added
          # /docs/decisions/0014-a-dom-for-tests-only answered 404 while the other 37
          # URLs answered 200, then served 200 within a minute with nothing changed. A
          # path that has never existed before appears to propagate on its own schedule
          # after the deployment itself has reached the edge — so every PR that adds a
          # page would fail here otherwise, and a smoke test that goes red on a good
          # deploy is worse than none, because the next real failure gets waved through.
          #
          # The retry is on any mismatch rather than specifically on a 404 seen where a
          # 200 was wanted: nothing establishes that the lag can only ever look like
          # that, and /days/day-1-excavation.html expects a 308 and /definitely-not-a-page
          # a 404, so "not yet what we asked for" is the only shape worth matching on.
          #
          # The budget stays deliberately small. The poll above can already spend five
          # minutes of this job's timeout-minutes: 10, and check() runs about 38 times —
          # so a wholly broken deployment must still cost seconds per URL, or the job is
          # killed on time and reports a timeout instead of naming what was wrong.
          check() {
            attempt=1
            while :; do
              got=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE_URL$1")
              [ "$got" = "$2" ] && break
              [ "$attempt" -ge 3 ] && break
              attempt=$((attempt + 1))
              sleep 2
            done

            if [ "$got" != "$2" ]; then
              echo "::error::$1 returned $got, expected $2 (after $attempt attempts)"
              fail=1
            elif [ "$attempt" -gt 1 ]; then
              # Said out loud rather than absorbed. The point of the retry is to tolerate
              # a slow path, not to hide one — if this line starts appearing on paths
              # that are not brand new, propagation has got worse and the budget above is
              # the next thing to go.
              echo "ok  $1 -> $got (on attempt $attempt — slow to propagate)"
            else
              echo "ok  $1 -> $got"
            fi
          }

          # One per URL shape the build produces. The expectations here were WRONG on
          # first contact with a real deployment and are corrected from observed
          # behaviour, not from what the local build serves:
          #
          #  - Pages canonicalises `/x.html` to `/x` with a 308. Every internal link in
          #    the site is written with the extension, so the redirect is on the normal
          #    path, not an edge case. Both forms are asserted: the redirect must stay a
          #    redirect, and the canonical form must serve the page.
          #  - Without a 404.html, Pages answers every unmatched path with 200 and the
          #    home page, so a typo'd link looks like a working page. 404.md exists to
          #    make that a real 404.
          check "/" 200
          check "/days/day-1-excavation" 200
          check "/days/day-1-excavation.html" 308
          check "/rigorous/" 200
          check "/docs/decisions/" 200
          check "/assets/css/style.css" 200
          check "/definitely-not-a-page" 404

          # The zone can override what Pages sends. Its default Browser Cache TTL is
          # four hours, which silently rewrote max-age=0 to max-age=14400 on static
          # assets until a Cache Rule set Browser Cache TTL to "Respect Origin". A
          # service worker served that way strands installed clients on stale code for
          # up to four hours after a deploy — the exact failure docs/decisions/0005
          # chose Cloudflare to be able to prevent.
          #
          # That rule lives in a dashboard, not in this repository, so nothing here can
          # stop it being changed or lost. This asserts the OBSERVABLE consequence
          # instead: every path must serve the same Cache-Control through the zone as
          # the origin sends without one. Comparing the two rather than hard-coding a
          # value means this keeps working unchanged when _headers starts declaring
          # different policies per path (#23).
          ORIGIN="https://life-compass-4ga.pages.dev"
          for path in / /assets/css/style.css /days/day-1-excavation; do
            through=$(curl -sSI "$BASE_URL$path" | tr -d '\r' | awk 'tolower($1)=="cache-control:"{$1="";print substr($0,2)}')
            direct=$(curl -sSI "$ORIGIN$path"  | tr -d '\r' | awk 'tolower($1)=="cache-control:"{$1="";print substr($0,2)}')
            # Guard against comparing nothing to nothing. If curl fails or the header is
            # absent, both sides are empty, compare equal, and the check passes having
            # verified precisely nothing — the same fail-open shape as a test glob that
            # matches no files.
            if [ -z "$through" ] || [ -z "$direct" ]; then
              echo "::error::$path returned no cache-control header (zone='$through' origin='$direct') — cannot verify"
              fail=1
            elif [ "$through" != "$direct" ]; then
              echo "::error::$path cache-control differs through the zone: '$through' vs origin '$direct'. Check the Cache Rule setting Browser Cache TTL to Respect Origin."
              fail=1
            else
              echo "ok  $path cache-control respected -> $through"
            fi
          done

          # The _headers file is checked at build time, but that only proves what we
          # declared. This proves Cloudflare applies it — on the real hostname, with the
          # zone in front, which is the only place the claim in docs/decisions/0006 is
          # actually true or false.
          csp=$(curl -sSI "$BASE_URL/" | tr -d '\r' | awk 'tolower($1)=="content-security-policy:"{$1="";print substr($0,2)}')
          if [ -z "$csp" ]; then
            echo "::error::no Content-Security-Policy served — the privacy claim is unenforced"
            fail=1
          else
            for directive in "default-src 'self'" "connect-src 'none'" "form-action 'none'"; do
              case "$csp" in
                *"$directive"*) echo "ok  CSP contains $directive" ;;
                *) echo "::error::CSP served without $directive: $csp"; fail=1 ;;
              esac
            done
          fi

          for header in x-content-type-options referrer-policy; do
            value=$(curl -sSI "$BASE_URL/" | tr -d '\r' | awk -v h="$header:" 'tolower($1)==h{$1="";print substr($0,2)}')
            if [ -z "$value" ]; then
              echo "::error::$header is not served"
              fail=1
            else
              echo "ok  $header -> $value"
            fi
          done

          # The PWA shell. /sw.js must revalidate or installed clients keep an old
          # worker; the manifest and icons must exist or the install prompt never
          # appears, and installation is what makes storage durable (0008).
          check "/sw.js" 200

          # Every URL the worker claims to precache, read from the worker itself rather
          # than listed here. A hand-written list drifts: this one asserted
          # /assets/js/sw-register.js for exactly one deploy after that file was renamed,
          # turning a correct deployment into a red build. Deriving it also makes this a
          # production check of the property cache.addAll depends on — the install is
          # atomic, so a single 404 in that list leaves clients with no worker at all.
          precached=$(sed -n '/^const PRECACHE = \[/,/^\];/p' dist/sw.js | grep -oE '"/[^"]*"' | tr -d '"')
          if [ -z "$precached" ]; then
            echo "::error::could not read PRECACHE from dist/sw.js; nothing was verified"
            fail=1
          fi
          for path in $precached; do
            check "$path" 200
          done

          sw_cache=$(curl -sSI "$BASE_URL/sw.js" | tr -d '\r' | awk 'tolower($1)=="cache-control:"{$1="";print substr($0,2)}')
          case "$sw_cache" in
            *no-cache*) echo "ok  /sw.js cache-control -> $sw_cache" ;;
            *) echo "::error::/sw.js served '$sw_cache'; without no-cache an installed client never sees a deploy"; fail=1 ;;
          esac

          # Assert what the browser will ENFORCE, not what appears somewhere in the
          # response. Pages appends matching rules, and a browser enforces the
          # intersection of every policy delivered — so a response carrying both
          # `connect-src 'none'` and `connect-src 'self'` leaves the worker unable to
          # fetch. Checking that 'self' is present passed over exactly that.
          sw_csp=$(curl -sSI "$BASE_URL/sw.js" | tr -d '\r' | awk 'tolower($1)=="content-security-policy:"{$1="";print substr($0,2)}')
          sw_csp_count=$(printf '%s\n' "$sw_csp" | grep -c . || true)
          if [ "$sw_csp_count" -ne 1 ]; then
            echo "::error::/sw.js carries $sw_csp_count Content-Security-Policy headers; the browser enforces their intersection, so the worker cannot fetch: $sw_csp"
            fail=1
          elif printf '%s' "$sw_csp" | grep -q "connect-src 'none'"; then
            echo "::error::/sw.js is bound by connect-src 'none'; precaching cannot fetch anything"
            fail=1
          elif printf '%s' "$sw_csp" | grep -q "connect-src 'self'"; then
            echo "ok  /sw.js may fetch same-origin, and nothing else"
          else
            echo "::error::/sw.js CSP is '$sw_csp'; expected connect-src 'self'"
            fail=1
          fi

          exit $fail
